<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Korasty Interactive Lessons | Cloud Classroom</title>
    
    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/style.css">
</head>
<body class="antialiased selection:bg-indigo-100 text-slate-800" data-lang="en">

    <!-- Global Header -->
    <header id="mainHeader" class="sticky top-0 z-50 bg-gradient-to-r from-indigo-600 via-indigo-700 to-pink-600 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div id="brandContainer" class="flex items-center gap-3">
                <a href="/en/index.html" class="text-4xl p-2 bg-white/10 hover:bg-white/20 rounded-2xl border border-white/20 transition-all">📚</a>
                <div>
                    <h1 id="brandName" class="text-xl sm:text-2xl font-extrabold text-white flex items-center gap-2">
                        <a href="/en/index.html" class="hover:underline">
                            <span>Korasty | Cloud Lessons</span>
                        </a>
                    </h1>
                    <div class="flex flex-wrap items-center gap-2 mt-1">
                        <span class="px-2 py-0.5 bg-yellow-400 text-slate-900 font-black text-[10px] tracking-wider rounded-md">Korasty.dpdns.org</span>
                    </div>
                </div>
            </div>
            
            <div id="headerActions" class="flex items-center gap-3">
                <a href="/en/index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white font-bold text-sm border border-white/15 rounded-xl transition-all">
                    <span>🏠 Home</span>
                </a>
                <button id="langToggleBtn" onclick="toggleLanguage()" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white font-bold text-sm border border-white/15 rounded-xl transition-all cursor-pointer">
                    🌐 العربية 🇪🇬
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div id="mainLayoutContainer" class="max-w-7xl mx-auto px-4 py-8 flex flex-col gap-8">
        
        <!-- Search Bar Section -->
        <section id="searchSection" class="w-full max-w-2xl mx-auto">
            <div id="searchBarWrapper" class="relative flex items-center bg-white border border-gray-100 rounded-2xl shadow-sm p-2 transition-all focus-within:ring-2 focus-within:ring-indigo-500/20">
                <span class="text-2xl px-3 text-slate-400">🔍</span>
                <input type="text" id="searchInput" class="w-full bg-transparent border-none outline-none py-2 text-sm text-slate-800 placeholder-slate-400" placeholder="Search for a lesson, language, or word...">
                <button id="searchButton" onclick="filterLessons()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition-all cursor-pointer">
                    <span>Search</span>
                </button>
            </div>
        </section>

        <!-- Sidebar + Content Body Grid -->
        <div id="contentSplitGrid" class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Filters Sidebar -->
            <aside id="filtersSidebar" role="search" aria-label="Filters" class="lg:col-span-1 bg-white border border-gray-100 shadow-xs rounded-3xl p-6 h-fit lg:sticky lg:top-24 text-left">
                <div class="mb-6 pb-4 border-b border-gray-100">
                    <h3 class="text-sm font-extrabold text-slate-500 uppercase tracking-wider mb-4">
                        <span>Grade Levels</span>
                    </h3>
                    <div id="gradeFilterGroup" class="flex flex-col sm:flex-row sm:flex-wrap lg:flex-col gap-2">
                        <button onclick="filterByGrade('all')" aria-pressed="true" class="class-btn active w-full sm:w-auto lg:w-full text-left px-4 py-2.5 bg-indigo-600 text-white border-2 border-indigo-600 font-bold rounded-xl text-sm transition-all cursor-pointer">
                            <span>All Grades</span>
                        </button>
                        <button onclick="filterByGrade('الأول الابتدائي')" aria-pressed="false" class="class-btn w-full sm:w-auto lg:w-full text-left px-4 py-2.5 bg-slate-50 text-slate-700 border-2 border-transparent font-semibold rounded-xl text-sm hover:bg-indigo-50/50 hover:text-indigo-600 transition-all cursor-pointer">
                            <span>1st Primary</span>
                        </button>
                        <button onclick="filterByGrade('الثاني الابتدائي')" aria-pressed="false" class="class-btn w-full sm:w-auto lg:w-full text-left px-4 py-2.5 bg-slate-50 text-slate-700 border-2 border-transparent font-semibold rounded-xl text-sm hover:bg-indigo-50/50 hover:text-indigo-600 transition-all cursor-pointer">
                            <span>2nd Primary</span>
                        </button>
                        <button onclick="filterByGrade('الثالث الابتدائي')" aria-pressed="false" class="class-btn w-full sm:w-auto lg:w-full text-left px-4 py-2.5 bg-slate-50 text-slate-700 border-2 border-transparent font-semibold rounded-xl text-sm hover:bg-indigo-50/50 hover:text-indigo-600 transition-all cursor-pointer">
                            <span>3rd Primary</span>
                        </button>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-extrabold text-slate-500 uppercase tracking-wider mb-4">
                        <span>Languages & Subjects</span>
                    </h3>
                    <div id="subjectFilterGroup" class="flex flex-col sm:flex-row sm:flex-wrap lg:flex-col gap-2">
                        <button onclick="filterBySubject('all')" aria-pressed="true" class="subject-btn active w-full sm:w-auto lg:w-full text-left px-4 py-2 bg-pink-600 text-white border border-pink-600 font-semibold rounded-xl text-xs transition-all cursor-pointer">
                            <span>All Languages</span>
                        </button>
                        <button onclick="filterBySubject('عربي')" aria-pressed="false" class="subject-btn w-full sm:w-auto lg:w-full text-left px-4 py-2 bg-transparent text-slate-700 border border-slate-200 hover:border-pink-300 font-semibold rounded-xl text-xs transition-all cursor-pointer">
                            <span>Arabic Language</span>
                        </button>
                        <button onclick="filterBySubject('إنجليزي')" aria-pressed="false" class="subject-btn w-full sm:w-auto lg:w-full text-left px-4 py-2 bg-transparent text-slate-700 border border-slate-200 hover:border-pink-300 font-semibold rounded-xl text-xs transition-all cursor-pointer">
                            <span>English Language</span>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main id="mainContentArea" role="main" class="lg:col-span-3 flex flex-col gap-8">
                <!-- Lessons Grid Section -->
                <section id="lessonsSection">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-lg font-extrabold text-slate-700 flex items-center gap-2">
                            <span>🏫</span>
                            <span>Cloud Educational Lessons</span>
                        </h3>
                    </div>
                    <div id="lessonsGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                        <!-- Dynamic cards load from script -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Active Lesson Player Modal -->
    <div id="lessonModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="modal fixed inset-0 hidden items-center justify-center p-4 bg-slate-900/60 z-[200]">
        <div class="modal-content bg-white w-full max-w-4xl max-h-[92vh] rounded-3xl overflow-y-auto shadow-2xl flex flex-col">
            <div class="modal-header p-6 bg-gradient-to-r from-indigo-600 to-pink-600 text-white flex justify-between items-center gap-4">
                <h2 id="modalTitle" class="text-lg sm:text-xl font-extrabold truncate">Lesson Title</h2>
                <button onclick="closeLessonModal()" aria-label="Close lesson modal" class="close-btn text-white bg-white/10 hover:bg-white/20 p-2.5 rounded-xl text-base font-bold transition-all cursor-pointer">✕</button>
            </div>
            
            <div class="modal-body p-6 flex flex-col gap-6">
                <div id="modalVideoContainer"></div>
                <article id="modalContentBody" class="prose max-w-none text-slate-700 text-sm leading-relaxed"></article>

                <!-- Comments & Discussion Area -->
                <section id="commentsSection" class="border-t border-gray-100 pt-6 mt-4">
                    <h3 class="text-lg font-extrabold text-slate-800 mb-2 flex items-center gap-1.5">
                        <span>❓</span>
                        <span>Student Question Forum</span>
                    </h3>
                    <p class="text-xs text-slate-500 mb-4">
                        <span>Do you have a question? Submit it below to get direct feedback!</span>
                    </p>

                    <div class="bg-slate-50 border border-slate-100 p-5 rounded-2xl mb-6">
                        <form id="commentForm" onsubmit="submitComment(event)" class="flex flex-col gap-4">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div class="flex flex-col gap-1.5">
                                    <label for="commenterName" class="text-xs font-bold text-slate-600">
                                        <span>Your Nice Name 👶</span>
                                    </label>
                                    <input type="text" id="commenterName" required class="px-4 py-2 bg-white border border-slate-200 focus:border-indigo-500 rounded-xl outline-none text-sm font-semibold text-slate-700" placeholder="e.g. Adam">
                                </div>
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label for="commentText" class="text-xs font-bold text-slate-600">
                                    <span>Your Question 💬</span>
                                </label>
                                <textarea id="commentText" required rows="3" class="px-4 py-3 bg-white border border-slate-200 focus:border-indigo-500 rounded-xl outline-none text-sm text-slate-700 resize-none" placeholder="Write your question clearly here..."></textarea>
                            </div>
                            <button type="submit" class="self-end px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition-all cursor-pointer">
                                <span>Submit Cloud Question</span>
                            </button>
                        </form>
                    </div>

                    <div id="commentsListContainer" class="flex flex-col gap-4"></div>
                </section>
            </div>
        </div>
    </div>

    <!-- Google Translate Hidden Widget Container -->
    <div id="google_translate_element" style="display: none !important;"></div>

    <!-- Google Translate Script Loader -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'ar,en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Custom Floating Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Load Module Controller -->
    <script type="module" src="/script.js"></script>
</body>
</html>
